<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roblox Login UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background">
        <div class="login-box">
            <h2>Add Account</h2>
            <form>
                <input type="text" placeholder="Username/Email/Phone" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Log In</button>
                <a href="#">Forgot Password or Username?</a>
                <div class="options">
                    <button type="button">Email Me a One-Time Code</button>
                    <button type="button">Use Another Device</button>
                </div>
                <a href="#" class="create">Create A New Account</a>
            </form>
        </div>
    </div>
</body>

</html>
