<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .left {
      display: none;
    }

    .left img {
      width: 250px;
    }

    .right {
      background: white;
      border: 1px solid #ccc;
      padding: 40px;
      width: 300px;
      text-align: center;
    }

    .right h1 {
      font-family: 'Cookie', cursive;
      font-size: 40px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fafafa;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #3897f0;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #ccc;
    }

    .divider:not(:empty)::before {
      margin-right: .5em;
    }

    .divider:not(:empty)::after {
      margin-left: .5em;
    }

    .facebook-login {
      color: #385185;
      font-weight: bold;
      margin-top: 10px;
    }

    .forgot {
      font-size: 12px;
      margin-top: 10px;
    }

    @media (min-width: 768px) {
      .left {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left">
      <img src="assets/insta_img.png" alt="Instagram Mockup">
    </div>

    <div class="right">
      <h1>Instagram</h1>
      <input type="text" placeholder="Phone number, username, or email">
      <input type="password" placeholder="Password">
      <button>Log In</button>

      <div class="divider">OR</div>

      <div class="facebook-login">Log in with Facebook</div>
      <div class="forgot">Forgot password?</div>
    </div>
  </div>
</body>

</html>
