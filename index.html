<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Overlay</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0px;
            padding: 0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url("https://miro.medium.com/v2/resize:fit:1400/0*VogK8oB22-E2LD8O");
            background-size: cover;
            background-position: center;
        }

        .main {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.703);
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="main"></div>
    </div>
</body>

</html>
