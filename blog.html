<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!-- Кодировка -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Адаптив -->
    <title>Document</title> <!-- Заголовок -->

    <style>
        * {
            box-sizing: border-box; /* Учитывать рамки и отступы */
        }

        body {
            font-family: Arial;
            padding: 20px;
            background: #f1f1f1;
        }

        /* Заголовок */
        .header {
            padding: 30px;
            font-size: 40px;
            text-align: center;
            background: white;
        }

        /* Левая колонка */
        .leftcolumn {
            float: left;
            width: 75%;
        }

        /* Правая колонка */
        .rightcolumn {
            float: left;
            width: 25%;
            padding-left: 20px;
        }

        /* Карточка */
        .card {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
        }

        /* Сброс float */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Подвал */
        .footer {
            padding: 20px;
            text-align: center;
            background: #ddd;
            margin-top: 20px;
        }

        /* Адаптив */
        @media screen and (max-width: 800px) {
            .leftcolumn, .rightcolumn {
                width: 100%;
                padding: 0;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Blog Name</h2>
    </div>

    <div class="row">
        <div class="leftcolumn">
            <div class="card">
                <h2>TITLE HEADING</h2>
                <h5>Title description, Dec 7, 2017</h5>
                <img src="https://picsum.photos/800/200" alt="Example image" style="width:100%;"> <!-- Пример фото -->
                <p>Some text..</p>
            </div>

            <div class="card">
                <h2>TITLE HEADING</h2>
                <h5>Title description, Sep 2, 2017</h5>
                <img src="https://placekitten.com/800/200" alt="Kitten image" style="width:100%;"> <!-- Котик -->
                <p>Some text..</p>
            </div>
        </div>

        <div class="rightcolumn">
            <div class="card">
                <h2>About Me</h2>
                <img src="https://picsum.photos/200/100" alt="About me image" style="width:100%;"> <!-- Фото -->
                <p>Some text about me in culpa qui officia deserunt mollit anim..</p>
            </div>

            <div class="card">
                <h3>Popular Post</h3>
                <img src="https://placekitten.com/200/150" alt="Popular post 1" style="width:100%;"><br>
                <img src="https://picsum.photos/200/150" alt="Popular post 2" style="width:100%;"><br>
                <img src="https://placekitten.com/200/150" alt="Popular post 3" style="width:100%;">
            </div>

            <div class="card">
                <h3>Follow Me</h3>
                <p>Some text..</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <h2>Footer</h2>
    </div>

</body>
</html>
