<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --background-color: rgb(252, 251, 251);
            --font-color: rgb(0, 0, 0);
            --second-font-color: rgb(101, 101, 101);
            --secondary-font-color: rgb(179, 179, 179);
            --backgorund-on-hover: rgb(215, 214, 214);
        }

        .dark-mode {
            --background-color: rgb(15, 15, 15);
            --font-color: rgb(254, 252, 252);
            --second-font-color: rgb(197, 195, 195);
            --secondary-font-color: rgb(108, 106, 106);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        p {
            font-family: 'Roboto', sans-serif;
        }

        .container {
            display: flex;
        }

        .midlle-section {
            display: flex;
        }

        a {
            text-decoration: none;
            color: var(--font-color);
            font-family: 'Signika', sans-serif;
            font-size: 0.9rem;
            font-weight: 550;
        }

        body {
            background-color: var(--background-color);
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            gap: 100vh;
            height: 100vh;
            width: 245px;
            background-color: var(--background-color);
            padding-top: 20px;
            padding-bottom: 10px;
            padding-inline: 10px;
            border-right: 0.1px solid rgba(76, 75, 75, 0.737);
            position: sticky;
            top: 0;
        }

        @media (max-width: 768px) {
            .container .navbar {
                flex-direction: row;
                background-color: var(--background-color);
                position: fixed;
                z-index: 1000;
                height: 60px;
                bottom: -1px;
                top: auto;
                gap: 0;
                border-right: none;
                width: 100vw;
                justify-content: space-around;
                align-items: center;
                padding: 0;
                box-shadow: -1px 14px 20px 4px rgba(0, 0, 0, 0.1);
            }

            .middle-section .post_section {
                padding: 40px 5px;
            }

            .navbar a {
                display: none;
            }

            .navbar .sub-section {
                padding: 10px 10px;
            }

            #hidden {
                display: none;
            }

            #hidden1 {
                display: none;
            }

            .instagram-text-logo {
                display: none;
            }
        }

        @media (max-width :1198) {
            .navbar .sub-section a {
                display: none;
            }

            .navbar .menu-section a {
                display: none;
            }

            .navbar .sub-section {
                gap: 0;
            }

            .instagram-text-logo {
                display: none;
            }

            .navbar {
                width: 79px;
            }
        }

        @media (max-width: 1003) {
            .follow-section {
                display: none;
            }

            .middle-section .post-area {
                padding-inline: 0;
            }
        }

        @media (max-width:690px) {
            .post-section .story-section {
                justify-content: space-evenly;
            }

            .story-section #story-7 {
                display: none;
            }
        }

        @media (max-width : 482px) {
            .story-section #story-5 {
                display: none;
            }
        }

        @media (max-width:562px) {
            .story-section #story-6 {
                display: none;
            }
        }

        @media (max-width:402px) {
            .story-section #story-4 {
                display: none;
            }
        }

        @media (max-width:323px) {
            .story-section #story-3 {
                display: none;
            }
        }

        @media (max-width:259px) {
            #story2 {
                display: none;
            }
        }

        .instagram-text-logo {
            width: 150px;
            margin: 5px 30px;
            cursor: pointer;
        }

        .instagram-text-logo img {
            width: 100%;
        }

        .sub-section {
            display: flex;
            align-items: center;
            gap: 25px;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.2s ease;
        }

        .sub-section:hover {
            background-color: var(--backgorund-on-hover);
        }

        .sub-section:hover i {
            transform: scale(1.07);
            transition: all 0.2 ease;
        }

        .sub-section a {
            font-weight: 600;
        }

        .sub-section:hover .profil-img {
            transform: scale(1.07);
            transition: all 0.2 ease;
        }

        .sub-section i {
            font-size: 1.3rem;
            color: var(--font-color);
        }

        .profile-img {
            width: 22px;
            transition: all 0.2 ease;
            cursor: pointer;
        }

        .profile-img img {
            width: 100%;
            border-radius: 50%;
        }

        .menu-section {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 23px;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .menu-section:hover {
            background-color: var(--backgorund-on-hover);
        }


        .menu-section i {
            color: var(--font-color);
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .post-section {
            padding: 20px 20px;
            background-color: var(--background-color);
            max-width: 660px;
        }

        .story-section {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .story {
            overflow: hidden;
            display: flex;
            gap: 10px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-image {
            background-color: #4158D0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 65px;
            width: 65px;
            background-image: cover;
        }

        .story-image img {
            width: 90%;
            height: 90%;
            border: 2px solid var(--background-color);
            border-radius: 50%;
            background-image: cover;
            background-position: center;
            background-size: cover;
        }

        .story span {
            font-family: 'Roboto', sans-serif;
            color: var(--font-color);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .post-area {
            margin-top: 50px;
            padding-inline: 80px;
            margin-bottom: 50px;
        }

        .post-main {
            color: var(--font-color);
        }

        .post-image {
            width: 40px;
            height: 40px;
            background-color: #4158D0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        
    </style>

</head>
